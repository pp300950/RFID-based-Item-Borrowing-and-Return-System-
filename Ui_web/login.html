<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ — ระบบยืม-คืนอุปกรณ์ RFID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="scene">
    <div class="pass-card">

      <div class="pass-header">
        <div class="pass-eyebrow">ACCESS PASS · SYSTEM ENTRY</div>
        <h1 class="pass-title">ระบบยืม–คืนอุปกรณ์</h1>
        <div class="pass-sub">แตะบัตรที่เครื่องอ่าน หรือเข้าสู่ระบบด้านล่างเพื่อเริ่มใช้งาน</div>
      </div>

      <div class="tab-row" role="tablist">
        <button class="tab-btn is-active" id="tab-student" role="tab" aria-selected="true">นักเรียน</button>
        <button class="tab-btn" id="tab-admin" role="tab" aria-selected="false">แอดมิน</button>
      </div>

      <div class="perforation" aria-hidden="true"></div>

      <!-- ฟอร์มนักเรียน -->
      <form id="form-student" class="pass-form" autocomplete="off">
        <div class="field">
          <label for="s-name">ชื่อ–นามสกุล</label>
          <input type="text" id="s-name" name="name" placeholder="เช่น ด.ช. สมชาย ใจดี" required />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="s-room">ห้อง</label>
            <input type="text" id="s-room" name="room" placeholder="เช่น A309" required />
          </div>
          <div class="field">
            <label for="s-seat">เลขที่</label>
            <input type="text" id="s-seat" name="seatNo" placeholder="เช่น 12" required />
          </div>
        </div>

        <div class="field">
          <label for="s-code">รหัสประจำตัวนักเรียน</label>
          <input type="text" id="s-code" name="studentCode" placeholder="เช่น 69319011766" inputmode="numeric" required />
          <div class="field-hint">ต้องขึ้นต้นด้วย 693190 และมีทั้งหมด 11 หลัก</div>
        </div>

        <button type="submit" class="submit-btn">
          <span class="scan-dot" aria-hidden="true"></span>
          เข้าสู่ระบบ
        </button>
      </form>

      <!-- ฟอร์มแอดมิน -->
      <form id="form-admin" class="pass-form is-hidden" autocomplete="off">
        <div class="field">
          <label for="a-username">Username</label>
          <input type="text" id="a-username" name="username" placeholder="admin" required />
        </div>
        <div class="field">
          <label for="a-password">Password</label>
          <input type="password" id="a-password" name="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="submit-btn submit-btn--admin">
          <span class="scan-dot" aria-hidden="true"></span>
          เข้าสู่ระบบแอดมิน
        </button>
      </form>

      <div id="status-msg" class="status-msg" role="status" aria-live="polite"></div>

      <div class="pass-footer">
        <span class="stamp">TEST&nbsp;BUILD</span>
        <span class="footer-text">เวอร์ชันทดสอบ · ข้อมูลเก็บบน Supabase</span>
      </div>

    </div>
  </div>

<script src="/js/login.js"></script>
</body>
</html>
