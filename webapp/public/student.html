<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>รายการของ — ระบบยืม-คืนอุปกรณ์ RFID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/student.css" />
</head>
<body>

  <div class="student-shell">

    <header class="student-topbar">
      <div>
        <div class="student-brand-eyebrow">ACCESS PASS · STUDENT</div>
        <h1 class="student-brand-title">รายการของยืม-คืน</h1>
      </div>

      <div class="student-user-block">
        <div class="student-user-name">
          <strong id="user-name">—</strong>
          <span id="user-meta"></span>
        </div>
        <button id="logout-btn" class="logout-btn">ออกจากระบบ</button>
      </div>
    </header>

    <main class="student-main">

      <!-- ============== คำขอที่รออนุมัติ ============== -->
      <section id="pending-block" style="display: none;">
        <h2 class="student-section-title">คำขอที่รออนุมัติ</h2>
        <p class="student-section-sub">รายการที่คุณส่งไว้ กำลังรอครูที่ดูแลห้องนั้นกดอนุมัติ</p>
        <div id="pending-strip" class="pending-strip"></div>
      </section>

      <!-- ============== รายการของทั้งหมด ============== -->
      <section>
        <h2 class="student-section-title">ของทั้งหมดในระบบ</h2>
        <p class="student-section-sub">เลือกของที่ต้องการยืม หรือกดคืนของที่คุณถืออยู่</p>

        <div class="filter-row">
          <label for="search-input">ค้นหา</label>
          <input type="text" id="search-input" placeholder="ค้นหาชื่อของหรือห้อง..." />

          <label for="status-filter">สถานะ</label>
          <select id="status-filter">
            <option value="">ทั้งหมด</option>
            <option value="available">ว่าง</option>
            <option value="borrowed">ถูกยืมอยู่</option>
          </select>
        </div>

        <div id="items-grid" class="items-grid">
          <div class="empty-state">กำลังโหลด...</div>
        </div>
      </section>

    </main>
  </div>

  <div id="toast" class="student-toast" role="status" aria-live="polite"></div>

<script src="/js/student.js"></script>
</body>
</html>
